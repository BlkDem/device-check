ShortDescription: Hardware report and drive health (NVMe / SATA SMART) for Windows in a local dashboard.
Description: |-
  Device Check Agent reads your PC hardware locally and shows it in a dashboard on 127.0.0.1:
  CPU, memory modules and slots, motherboard and BIOS, GPUs, monitors, drives with NVMe health log / SATA SMART,
  temperature, wear and free space. Every value comes with its source and confidence.
  Read-only, no administrator rights, no drivers or services, no telemetry; reports never leave the computer.
