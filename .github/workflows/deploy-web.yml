name: Deploy site

# Static site → device-check.umolab.ru (nginx serves /var/www/fastuser/data/www/device-check.umolab.ru).
# The deploy key is restricted on the server with rrsync to that directory only.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://device-check.umolab.ru
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run generate

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload
        # --delay-updates: new files appear together at the end; downloads/ (agent releases) is never touched here.
        run: |
          rsync -rlptz --delete --delay-updates --exclude=/downloads/ --chmod=D2775,F664 \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            .output/public/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:./"

      - name: Smoke test
        run: |
          for p in / /agent /about /limitations /privacy; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "https://device-check.umolab.ru$p") # /agent → 301 → /agent/
            echo "$p $code"; test "$code" = 200
          done
