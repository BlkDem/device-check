name: CI

on:
  push:
    branches-ignore: [main] # main runs the same checks inside deploy-web / release
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (tests, types, static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run generate

  agent:
    name: Agent (build, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build agent/DeviceCheck.Agent.slnx -c Release
      - run: dotnet test agent/tests/DeviceCheck.Agent.Tests -c Release --no-build --logger "console;verbosity=normal"

  installer:
    name: Installer (build, install / uninstall smoke test)
    runs-on: windows-latest
    needs: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer, ZIPs and Store package (with the embedded dashboard)
        run: ./agent/build/publish.ps1 -Installer -SkipTests -Msix -MsixIdentityName "${{ vars.MSIX_IDENTITY_NAME || 'DeviceCheck.Agent' }}" -MsixPublisher "${{ vars.MSIX_PUBLISHER || 'CN=DeviceCheck' }}" -MsixPublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Device Check' }}"
      - name: Smoke test
        run: ./agent/build/smoke-installer.ps1
